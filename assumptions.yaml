# Hush noise model: every value the model uses.
# Each entry is {value, unit, source, status}.
#   sourced     = taken from (or exact arithmetic on) a value with a URL in research/R1..R6
#   calibrated  = tuned so the model matches measured field data (the calibration is shown in SOUND_MODEL.md or research/R3)
#   derived     = our own derivation or arithmetic from sourced values (not quoted text); added after review V1
#   placeholder = no source found; chosen by the plan or by S1 and waiting for research or a decision
# Spec: SOUND_MODEL.md. Written by S1 for issue #8. Gate 1 (Alejandro) must approve before code uses it.
# Build (issue #31): V1 review fixes applied (status labels, five missing keys, shielding cap, leak cap, berm
# dropped) and the R7 (road emission), R8 (aircraft), R9 (time of day) and field-test values added.

time:
  blocks:
    value: {overnight: [0, 6], morning_rush: [6, 10], midday: [10, 16], evening_rush: [16, 20], evening: [20, 24]}
    unit: hour of day, start inclusive, end exclusive
    source: docs/PLAN.md and docs/NOISE_MODEL_PLAN.md section 1 (team decision)
    status: sourced
  dnl_night_hours:
    value: [22, 7]
    unit: hour of day (22:00 to 07:00)
    source: https://www.ecfr.gov/current/title-24/subtitle-A/part-51/subpart-B/section-51.103
    status: sourced
  dnl_night_penalty:
    value: 10
    unit: dB
    source: https://www.ecfr.gov/current/title-24/subtitle-A/part-51/subpart-B/section-51.103
    status: sourced
  # R9: share of daily vehicles in each hour 00..23 (TMAS 2025, Jan/Apr/Jul/Oct, all days, pooled).
  # The published percentages sum to 100.02 (arterial) and 100.01 (freeway); code normalises them to 1.
  hourly_share:
    arterial:
      value: [0.88, 0.58, 0.54, 0.64, 1.28, 2.73, 4.26, 5.64, 5.34, 5.04, 5.19, 5.61, 6.07, 6.08, 6.34, 7.01, 7.64, 7.81, 6.39, 4.78, 3.74, 2.93, 2.11, 1.39]
      unit: percent of daily vehicles, hours 00..23 (Texas urban arterials, FC 14 and 16, 47 stations; also used for collectors and local streets, R9 conflict 6)
      source: https://www.fhwa.dot.gov/policyinformation/tables/tmasdata/ (R9 Q1)
      status: sourced
    freeway:
      value: [1.26, 0.90, 0.86, 0.88, 1.58, 3.57, 5.09, 5.37, 5.21, 5.15, 5.29, 5.50, 5.70, 5.78, 5.98, 6.23, 6.36, 6.20, 5.83, 5.07, 4.13, 3.45, 2.73, 1.89]
      unit: percent of daily vehicles, hours 00..23 (Houston district freeways, FC 11 and 12, 14 stations)
      source: https://www.fhwa.dot.gov/policyinformation/tables/tmasdata/ (R9 Q1)
      status: sourced
  # R9 Q2: truck share of VMT by period, Houston TxDOT district, 2025 weekday mix (TTI for TCEQ, App. C).
  # Used as a relative profile: each road keeps its own daily truck counts; only their spread over the day changes.
  truck_periods:
    value: {am: [7, 10], midday: [10, 16], pm: [16, 20], overnight: [20, 7]}
    unit: hour of day, start inclusive, end exclusive (overnight wraps midnight)
    source: https://www.tceq.texas.gov/downloads/air-quality/research/reports/on-road/5822343431013-20250521-houston-galveston-brazoria-hgb-dallas-fort-worth-dfw-and-bexar-county-nonattainment-areas-rfp-on-road-emissions.pdf (p.83, footnote 2 under Table 45; R9 conflict 5 notes Table 24 uses 06-09 for AM)
    status: sourced
  truck_share_by_period:
    arterial:
      value: {single_unit: {am: 0.0333, midday: 0.0442, pm: 0.0246, overnight: 0.0232}, combination: {am: 0.0435, midday: 0.0649, pm: 0.0359, overnight: 0.0851}}
      unit: fraction of VMT (urban unrestricted access, MOVES road type 5)
      source: https://www.tceq.texas.gov/downloads/air-quality/research/reports/on-road/5822343431013-20250521-houston-galveston-brazoria-hgb-dallas-fort-worth-dfw-and-bexar-county-nonattainment-areas-rfp-on-road-emissions.pdf (p.107; R9 Q2)
      status: sourced
    freeway:
      value: {single_unit: {am: 0.0401, midday: 0.0472, pm: 0.0249, overnight: 0.0251}, combination: {am: 0.0474, midday: 0.0638, pm: 0.0339, overnight: 0.0705}}
      unit: fraction of VMT (urban restricted access, MOVES road type 4)
      source: https://www.tceq.texas.gov/downloads/air-quality/research/reports/on-road/5822343431013-20250521-houston-galveston-brazoria-hgb-dallas-fort-worth-dfw-and-bexar-county-nonattainment-areas-rfp-on-road-emissions.pdf (p.107; R9 Q2)
      status: sourced
  # R9 Q5 / E4: Houston rail is close to flat over the day (FRA crossing inventory, 2025 counts).
  rail_day_share:
    value: 0.5157
    unit: fraction of through-train passages 06:00 to 18:00 (the rest is 18:00 to 06:00), spread evenly within each 12 h
    source: https://data.transportation.gov/Railroads/Crossing-Inventory-Data-Form-71-Current/m2f8-22s6 (R9 Q5, 3,158 day / 2,966 night trains)
    status: sourced
  night_share:
    road:
      value: 0.15
      unit: fraction of daily sound energy (= night share of ADT) between 22:00 and 07:00. Used only by the 'hud' road profile (SOUND_MODEL.md section 5); roads otherwise use time.hourly_share (R9)
      source: https://www.in.gov/ihcda/files/Appendix-11.-Noise-Abatement-and-Control-2025.pdf ; https://www.ecfr.gov/current/title-24/subtitle-A/part-51/subpart-B/section-51.106
      status: sourced
    aviation:
      value: 0.15
      unit: fraction of daily sound energy between 22:00 and 07:00
      source: none found for IAH or HOU (R1 Not found); road value reused
      status: placeholder

outdoor:
  bts:
    layer:
      value: USA_Transportation_Noise_2020 ImageServer, slices 0 aviation, 1 rail, 3 road
      unit: n/a
      source: https://tiledimageservices.arcgis.com/P3ePLMYs2RVChkJx/arcgis/rest/services/USA_Transportation_Noise_2020/ImageServer?f=json
      status: sourced
    metric:
      value: LAeq,24h, average annual day, free field, no shielding
      unit: dBA
      source: https://rosap.ntl.bts.gov/view/dot/90910/dot_90910_DS1.pdf
      status: sourced
    floor:
      value: 45.0
      unit: dBA LAeq,24h (a pixel of exactly 45.0 means "45 or less"; treat that mode as absent)
      source: https://rosap.ntl.bts.gov/view/dot/90910/dot_90910_DS1.pdf ; https://www.arcgis.com/home/item.html?id=439250230a414e46aa2846c7e2ae2048
      status: sourced
    grid:
      value: 30
      unit: m
      source: https://rosap.ntl.bts.gov/view/dot/90910/dot_90910_DS1.pdf
      status: sourced
    receptor_height:
      value: 1.5
      unit: m above ground
      source: https://rosap.ntl.bts.gov/view/dot/90910/dot_90910_DS1.pdf
      status: sourced
  construction:
    reference_distance:
      value: 50
      unit: ft
      source: https://www.fhwa.dot.gov/environment/noise/construction_noise/rcnm/rcnm.pdf
      status: sourced
    # Lmax at 50 ft. Use actual (measured) where it exists, spec otherwise (R1 conflict 7).
    equipment:
      excavator:
        value: {spec: 85, actual: 81,  usage: 0.40}
        unit: "dBA at 50 ft; usage fraction"
        source: "https://www.fhwa.dot.gov/environment/noise/construction_noise/rcnm/rcnm.pdf"
        status: sourced
      jackhammer:
        value: {spec: 85, actual: 89,  usage: 0.20}
        unit: "dBA at 50 ft; usage fraction"
        source: "https://www.fhwa.dot.gov/environment/noise/construction_noise/rcnm/rcnm.pdf"
        status: sourced
      dump_truck:
        value: {spec: 84, actual: 76,  usage: 0.40}
        unit: "dBA at 50 ft; usage fraction"
        source: "https://www.fhwa.dot.gov/environment/noise/construction_noise/rcnm/rcnm.pdf"
        status: sourced
      concrete_mixer:
        value: {spec: 85, actual: 79,  usage: 0.40}
        unit: "dBA at 50 ft; usage fraction"
        source: "https://www.fhwa.dot.gov/environment/noise/construction_noise/rcnm/rcnm.pdf"
        status: sourced
      crane:
        value: {spec: 85, actual: 81,  usage: 0.16}
        unit: "dBA at 50 ft; usage fraction"
        source: "https://www.fhwa.dot.gov/environment/noise/construction_noise/rcnm/rcnm.pdf"
        status: sourced
      impact_pile_driver:
        value: {spec: 95, actual: 101, usage: 0.20}
        unit: "dBA at 50 ft; usage fraction"
        source: "https://www.fhwa.dot.gov/environment/noise/construction_noise/rcnm/rcnm.pdf"
        status: sourced
      concrete_saw:
        value: {spec: 90, actual: 90,  usage: 0.20}
        unit: "dBA at 50 ft; usage fraction"
        source: "https://www.fhwa.dot.gov/environment/noise/construction_noise/rcnm/rcnm.pdf"
        status: sourced
      air_compressor:
        value: {spec: 80, actual: 78,  usage: 0.40}
        unit: "dBA at 50 ft; usage fraction"
        source: "https://www.fhwa.dot.gov/environment/noise/construction_noise/rcnm/rcnm.pdf"
        status: sourced
    allowed_hours:
      value: [7, 20]
      unit: hour of day
      source: https://nonoise.org/lawlib/cities/houston.htm (1997 copy of Houston Ch. 30; 2022 amendments not checked)
      status: placeholder
    hours_worked:
      value: all allowed hours inside an active block
      unit: h
      source: none (R1 Not found); loudest legal case
      status: placeholder

propagation:
  # Road and rail only. Aircraft get none of these. Construction: see SOUND_MODEL.md section 6, item B2.
  orientation:
    side_wall_loss:
      value: 3.0
      unit: dB (10*log10(180/90), FHWA finite-roadway adjustment, hard site)
      source: https://rosap.ntl.bts.gov/view/dot/30259/dot_30259_DS1.pdf ; https://doku.datakustik.com/CadnaA/en/Abbrev_Protocol-Road.html
      status: sourced
    back_wall_loss:
      value: 10
      unit: dB (cap of the visible-angle rule; value chosen inside the sourced 7 to 13 range, not tuned; V1 3c)
      source: https://www.fhwa.dot.gov/ENVIRonment/noise/noise_compatible_planning/federal_approach/audible_landscape/al04.cfm ; https://pmc.ncbi.nlm.nih.gov/articles/PMC3546762/ ; https://pmc.ncbi.nlm.nih.gov/articles/PMC6679167/
      status: placeholder
    multi_source_bearing_limit:
      value: 45
      unit: degrees (OSM bearing vs raster gradient; above this, no side-wall loss)
      source: R2 E5, analyst choice, no URL
      status: placeholder
  dominant_road:
    search_radius:
      value: 300
      unit: m
      source: R2 E5, analyst choice, no URL
      status: placeholder
    osm_classes:
      value: [motorway, trunk, primary, secondary]
      unit: OSM highway tag
      source: https://wiki.openstreetmap.org/wiki/Key:highway (class list is an R2 choice)
      status: placeholder
    soft_site_decay:
      value: 4.5
      unit: dB per doubling of distance (15*log10)
      source: https://rosap.ntl.bts.gov/view/dot/30259/dot_30259_DS1.pdf
      status: sourced
    min_reference_distance:
      value: 15
      unit: m
      source: R2 E5, analyst choice, no URL
      status: placeholder
  barrier:
    frequency:
      value: 550
      unit: Hz
      source: https://www.fhwa.dot.gov/Environment/noise/noise_barriers/design_construction/design/design03.cfm ; https://rosap.ntl.bts.gov/view/dot/30259/dot_30259_DS1.pdf
      status: sourced
    speed_of_sound:
      value: 343
      unit: m/s
      source: https://rosap.ntl.bts.gov/view/dot/30259/dot_30259_DS1.pdf (eq. 18)
      status: sourced
    fresnel_factor:
      value: 3.21
      unit: 1/m (N = 3.21 * delta)
      source: https://rosap.ntl.bts.gov/view/dot/30259/dot_30259_DS1.pdf (eq. 18)
      status: sourced
    n_cap:
      value: 5.03
      unit: dimensionless Fresnel number where the wall cap is reached
      source: https://rosap.ntl.bts.gov/view/dot/30259/dot_30259_DS1.pdf (eq. 15, OCR)
      status: sourced
    n_lower:
      value: -0.1916
      unit: dimensionless; below this the barrier gives 0 dB
      source: https://rosap.ntl.bts.gov/view/dot/30259/dot_30259_DS1.pdf (eq. 15, OCR)
      status: sourced
    cap_wall:
      value: 20
      unit: dBA
      source: https://www.fhwa.dot.gov/Environment/noise/noise_barriers/design_construction/design/design03.cfm
      status: sourced
    plus_foliage_cap:
      value: 20
      unit: dB (barrier + foliage added, then capped)
      source: none (R2 Not found)
      status: placeholder
    source_height:
      value: 0
      unit: m above ground (source end of the barrier path difference; the receiver is outdoor.bts.receptor_height plus the storeys below the unit)
      source: none; build choice
      status: placeholder
  foliage:
    min_path:
      value: 10
      unit: m (below this, 0 dB)
      source: https://doku.datakustik.com/CadnaA/en/BebaungBewuchs.html (ISO 9613-2 Table A.1)
      status: sourced
    short_path_loss:
      value: 1
      unit: dB for 10 to 20 m of tree path
      source: https://doku.datakustik.com/CadnaA/en/BebaungBewuchs.html
      status: sourced
    rate:
      value: 0.05
      unit: dB/m for 20 to 200 m (500 Hz band)
      source: https://doku.datakustik.com/CadnaA/en/BebaungBewuchs.html
      status: sourced
    max_path:
      value: 200
      unit: m
      source: https://www.sis.se/api/document/preview/608579/ (search snippet, not opened; V1 3c)
      status: placeholder
    cap:
      value: 10
      unit: dB
      source: https://rosap.ntl.bts.gov/view/dot/30259/dot_30259_DS1.pdf (p. 33)
      status: sourced
    fhwa_upper_bound:
      value: 5
      unit: dB per full 30 m of dense woods, 10 dB max (sensitivity runs only)
      source: https://rosap.ntl.bts.gov/view/dot/30259/dot_30259_DS1.pdf (p. 33)
      status: sourced
    tree_cover_input:
      value: Vexcel parcel-tree-cover.percent / 100 as the cover fraction along the whole path
      unit: fraction
      source: R5 (zone radii and denominator unconfirmed)
      status: placeholder
    max_tree_path_from_road:
      value: 61
      unit: m (200 ft; r_f = cover_fraction * min(distance_to_road, this); beyond it cover is unknown)
      source: SOUND_MODEL.md section 3.3 and R2 E3; missing key V1 3b item 1
      status: placeholder
  building_rows:
    first_row_40_65pct:
      value: 3
      unit: "dBA"
      source: "https://rosap.ntl.bts.gov/view/dot/30259/dot_30259_DS1.pdf"
      status: sourced
    first_row_65_90pct:
      value: 5
      unit: "dBA"
      source: "https://rosap.ntl.bts.gov/view/dot/30259/dot_30259_DS1.pdf"
      status: sourced
    first_row_under_40pct:
      value: 0
      unit: "dBA"
      source: "https://rosap.ntl.bts.gov/view/dot/30259/dot_30259_DS1.pdf"
      status: sourced
    each_further_row:
      value: 1.5
      unit: "dBA"
      source: "https://rosap.ntl.bts.gov/view/dot/30259/dot_30259_DS1.pdf"
      status: sourced
    trees_plus_rows_cap:
      value: 10
      unit: "dBA"
      source: "https://rosap.ntl.bts.gov/view/dot/30259/dot_30259_DS1.pdf"
      status: sourced
  shielding_total_cap:
    value: 25
    unit: dB (orientation or building rows, plus barrier and foliage, on one wall, after the other caps)
    source: V1 review 2a, from the ISO 9613-2 double-diffraction cap quoted in R2 Values
    status: placeholder

facade:
  incidence_constant:
    value: 3
    unit: dB (random incidence; derived from ASTM E966 Eq. 6)
    source: https://store.astm.org/e0966-18a.html (R3 E1 derivation; the hemisphere average is not quoted text, V1 3c)
    status: derived
  incidence_constant_line_source:
    value: 4.0
    unit: dB (long straight road; sensitivity only, not the default)
    source: https://store.astm.org/e0966-18a.html (R3 E1 derivation, V1 3c)
    status: derived
  aircraft_rating_offset:
    value: -3
    unit: dB added to OITC ratings of walls, windows and roof for aircraft (not to EWR door ratings, not to leaks)
    source: https://nrc-publications.canada.ca/eng/view/accepted/?id=361fd5c8-82ff-4c50-ba7b-d9f6739fef25
    status: sourced
  windows_open_reduction:
    value: 12
    unit: dB, free-field outdoor to room (range 10 to 15)
    source: https://nonoise.org/library/levels/levels.htm ; https://www.fhwa.dot.gov/Environment/noise/regulations_and_guidance/analysis_and_abatement_guidance/polguide02.cfm
    status: sourced
  window_fraction_default:
    value: 0.15
    unit: window area / gross exterior wall area
    source: docs/NOISE_MODEL_PLAN.md section 1.1 (no research source)
    status: placeholder
  leak_area_cap_fraction:
    value: 0.15
    unit: leak area per wall = f * min(opening area, this * wall area)
    source: V1 review 4b (R3 calibrated f at 15% glazing)
    status: placeholder
  default_era_when_year_unknown:
    value: "1980_1999"
    unit: era id
    source: docs/NOISE_MODEL_PLAN.md section 1.1; year built missing per R5
    status: placeholder

